- name: Install Netflix webapplication 
  hosts:
#    - qa_public_servers
  become: true
  tasks:
    - name: Installing apache server
      ansible.builtin.apt:
        name: apache2
        state: present
        update_cache: yes
    - name: starting apache server  
      ansible.builtin.systemd:
        name: apache2
        state: started
        enabled: yes
    - name: installing GIT
      ansible.builtin.apt:
        name: git
        state: present
    - name: Source code from Netflix
      git:
        repo: "https://github.com/CleverProgrammers/pwj-netflix-clone.git"
        dest: "/var/www/html/"